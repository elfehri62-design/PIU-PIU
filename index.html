<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIU-PIU — Le réseau qui nous rapproche</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#101C46;--panel:#172B60;--panel2:#243B78;
 --gold:#A98BFF;--white:#BFD5FF;--muted:#A9BCEB;
 --line:#405B9B;--green:#3478E8;--mint:#7DB5FF;
 --emerald:#50318F;--pink:#8156D9;--purple:#8156D9;--cyan:#7DB5FF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,sans-serif;padding:82px 0 85px}
button{background:#243B78;color:var(--white);border:1px solid #8156D9;padding:11px 14px;border-radius:22px;cursor:pointer;font-size:14px}
button.gold{background:linear-gradient(110deg,#8156D9,#3478E8);color:var(--white);font-weight:bold;border-color:#A98BFF}
button.pink{background:linear-gradient(100deg,#50318F,#8156D9);border:1px solid #A98BFF;color:var(--white);font-weight:bold}
button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:900px;margin:14px auto;padding:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}
h2,h3{color:#A98BFF}
input,textarea,select{width:100%;padding:13px;margin:7px 0;border:1px solid #5879C2;border-radius:9px;background:#172B60;color:var(--white);font-size:16px}
textarea{min-height:85px}
label{display:block;margin-top:12px;color:var(--muted)}
.hidden{display:none!important}
.muted,small{color:var(--muted)}
.status{color:#A98BFF;padding:8px}
.center{text-align:center}
.avatar{width:75px;height:75px;border:3px solid #8156D9;border-radius:50%;object-fit:cover;background:#243B78}
.member{display:flex;align-items:center;gap:12px}
.member-info{flex:1;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>*{flex:1}
.badge{display:inline-block;background:#50318F;padding:6px 10px;border-radius:20px;margin:3px;color:var(--white)}
.notice{padding:12px;background:#243B78;border-left:4px solid #8156D9;margin:10px 0;border-radius:8px}
.message{padding:12px;margin:8px 0;background:#243B78;border-radius:12px}
.mine{margin-left:12%;border:1px solid #8156D9}
.theirs{margin-right:12%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.tile{background:linear-gradient(145deg,#243B78,#302451);color:var(--white);border:1px solid #5879C2;border-radius:14px;padding:15px;text-align:center;cursor:pointer}
.tile .symbol{font-size:34px;margin-bottom:8px}
.price{color:#A98BFF;font-weight:bold}
.progress{height:13px;background:#101C46;border-radius:20px;overflow:hidden}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,#3478E8,#8156D9)}
footer{text-align:center;padding:25px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
a{color:#7DB5FF}

/* EN-TÊTE */
.piu-header{position:fixed;top:0;left:0;right:0;height:72px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:linear-gradient(100deg,#101C46,#243B78,#50318F);border-bottom:1px solid #8156D9;box-shadow:0 3px 15px #0005}
.piu-menu-button,.piu-account{width:45px;height:45px;border-radius:14px;font-size:23px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3478E8,#8156D9);border:1px solid #A98BFF}
.piu-brand{display:flex;align-items:center;gap:9px}
.piu-brand .logo{width:43px;height:43px;object-fit:contain;border:2px solid #8156D9;border-radius:50%;box-shadow:0 0 14px #8156D9}
.piu-brand h1{font-size:19px;letter-spacing:3px;color:#A98BFF;margin:0}
.piu-brand small{font-size:9px;letter-spacing:1px}

/* MENU LATÉRAL */
.piu-menu-overlay{position:fixed;inset:0;background:#0009;z-index:80;opacity:0;visibility:hidden;transition:.25s}
.piu-menu-overlay.open{opacity:1;visibility:visible}
.piu-side-menu{position:fixed;z-index:90;top:0;bottom:0;left:0;width:min(310px,85vw);background:linear-gradient(180deg,#101C46,#172B60,#302451);border-right:1px solid #8156D9;padding:16px;overflow-y:auto;transform:translateX(-105%);transition:transform .28s ease;box-shadow:8px 0 25px #0005}
.piu-side-menu.open{transform:translateX(0)}
.piu-menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.piu-menu-head h2{margin:0;color:#A98BFF;font-size:21px}
.piu-menu-close{font-size:23px;padding:7px 13px}
.piu-menu-group{color:#A98BFF;font-size:12px;font-weight:bold;letter-spacing:1px;margin:18px 4px 7px}
.piu-side-menu>button:not(.piu-menu-close){display:block;width:100%;text-align:left;border:0;border-radius:11px;background:transparent;padding:12px;margin:3px 0;color:var(--white)}
.piu-side-menu>button:not(.piu-menu-close):active,.piu-side-menu>button:not(.piu-menu-close):hover{background:#3478E8}

/* NAVIGATION BASSE */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(90deg,#101C46,#172B60,#302451);border-top:1px solid #8156D9;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}
.bottom-nav button{border:0;background:transparent;border-radius:10px;padding:6px 2px;color:#A9BCEB;font-size:11px}
.bottom-nav button span{display:block;font-size:22px;margin-bottom:3px}
.bottom-nav button.active{color:var(--white);background:#3478E8}

/* PROFIL */
.profile-page{background:linear-gradient(160deg,#101C46,#243B78,#302451);border:1px solid #8156D9;border-radius:25px;padding:0;overflow:hidden}
.profile-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 4px 20px}
.profile-top .avatar{width:105px;height:105px;border:4px solid #8156D9;box-shadow:0 0 15px #8156D966}
.profile-identity{flex:1;min-width:130px}
.profile-name{font-size:24px;color:var(--white);margin:5px 0}
.profile-id{color:#A98BFF;font-weight:bold}
.profile-flags{font-size:23px;margin:8px 0}
.online-pill{display:inline-block;background:#3478E8;color:var(--white);border-radius:20px;padding:6px 12px;font-size:13px}
.profile-stats{display:grid;grid-template-columns:repeat(4,1fr);background:#243B78;color:var(--white);border:1px solid #405B9B;border-radius:18px;padding:14px 5px;margin:12px 0;gap:3px}
.profile-stat{text-align:center;border-right:1px solid #405B9B}
.profile-stat:last-child{border:0}
.profile-stat strong{display:block;font-size:21px;color:var(--white)}
.profile-stat span{font-size:11px;font-weight:bold;color:var(--white)}
.profile-stat .symbol{font-size:23px}
.profile-private-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.profile-private-card{border-radius:18px;padding:16px 10px;color:var(--white);text-align:center;background:linear-gradient(145deg,#243B78,#50318F);border:1px solid #8156D9}
.profile-private-card.pink{background:linear-gradient(145deg,#302451,#50318F)}
.profile-private-card .symbol{font-size:30px}
.profile-vip-bar{background:linear-gradient(90deg,#50318F,#8156D9,#3478E8);color:var(--white);border:1px solid #A98BFF;border-radius:16px;padding:16px;font-weight:bold;margin:14px 0;cursor:pointer}
.profile-shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#243B78;border:1px solid #405B9B;border-radius:18px;padding:12px 6px}
.profile-shortcut{color:var(--white);text-align:center;padding:8px 2px;cursor:pointer;font-size:11px;font-weight:bold}
.profile-shortcut .symbol{font-size:27px;display:block;margin-bottom:5px}
.profile-banner{background:linear-gradient(110deg,#101C46,#3478E8,#50318F);border:1px solid #8156D9;border-radius:18px;padding:22px 12px;margin:16px 0;text-align:center}
.profile-banner strong{font-size:25px;color:var(--white)}
.profile-center-links{background:#243B78;color:var(--white);border:1px solid #405B9B;border-radius:18px;padding:8px 16px;margin:14px 0}
.profile-center-links button{display:block;width:100%;text-align:left;background:transparent;color:var(--white);border:0;border-bottom:1px solid #405B9B;border-radius:0;padding:15px 5px;font-weight:bold}
.profile-actions{display:flex;gap:8px;margin-top:18px}
.profile-actions button{flex:1;background:linear-gradient(110deg,#3478E8,#8156D9);border:0;border-radius:28px;padding:13px 5px;font-weight:bold}
.profile-edit{background:#172B60;border:1px solid #405B9B;border-radius:16px;padding:14px;margin:14px}
.profile-section-title{color:#A98BFF;margin:18px 0 10px}

/* NOUVEAU PROFIL PIU-PIU */
.profile-showcase{position:relative;padding:14px;background:radial-gradient(ellipse at top right,#8156D988,transparent 55%),linear-gradient(145deg,#101C46,#172B60 55%,#50318F)}
.profile-cover{min-height:135px;border-radius:18px;background:linear-gradient(120deg,#3478E8,#50318F,#101C46);border:1px solid #8156D9;box-shadow:0 0 20px #8156D944}
.profile-showcase .profile-top{position:relative;margin-top:-48px;align-items:flex-end;padding:0 5px 12px}
.profile-showcase .avatar{width:105px;height:105px;border:4px solid #8156D9;box-shadow:0 0 18px #8156D9}
.profile-showcase .profile-name{text-shadow:0 0 10px #3478E8}
.profile-follow-plus{width:62px;height:62px;min-width:62px;border-radius:50%;padding:0;font-size:38px;line-height:1;color:#fff;background:linear-gradient(145deg,#3478E8,#8156D9);border:3px solid #A98BFF;box-shadow:0 0 18px #8156D9}
.profile-follow-plus.following{background:linear-gradient(145deg,#50318F,#3478E8)}
.profile-info-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 0}
.profile-info-card{background:linear-gradient(130deg,#243B78,#50318F);border:1px solid #8156D9;border-radius:16px;padding:13px 9px;color:var(--white);text-align:center}
.profile-tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#243B78;border-bottom:1px solid #8156D9}
.profile-tabs div{text-align:center;padding:15px 3px;font-size:25px}
.profile-contribution{margin:14px;padding:15px;border-radius:17px;background:linear-gradient(100deg,#50318F,#8156D9,#3478E8);border:1px solid #A98BFF}
.profile-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px 14px}
.profile-gallery-item{aspect-ratio:1;border-radius:13px;background:linear-gradient(145deg,#243B78,#50318F);border:1px solid #8156D9;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.profile-gallery-item img{width:100%;height:100%;object-fit:cover}
.profile-public-section{padding:5px 16px 15px}
.profile-interest{display:inline-block;padding:8px 12px;margin:4px;border-radius:22px;background:#243B78;border:1px solid #8156D9;color:var(--white)}
.profile-bottom-actions{display:flex;gap:10px;padding:12px 14px 18px}
.profile-bottom-actions button{flex:1;min-height:52px;border-radius:28px;background:linear-gradient(100deg,#50318F,#3478E8);border:1px solid #A98BFF;font-weight:bold}
.profile-owner-balance{margin:12px 14px}

/* PARTY ET EXPLORATION */
.piu-hero{background:linear-gradient(130deg,#101C46,#3478E8,#50318F);border-radius:20px;padding:22px 15px;margin:12px 0;text-align:center;border:1px solid #8156D9}
.piu-hero h2{color:var(--white);font-size:25px}
.piu-pills{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.piu-pills button{white-space:nowrap}
.room-card{background:linear-gradient(145deg,#172B60,#50318F);border:1px solid #8156D9;border-radius:18px;padding:14px;margin:10px 0}
.room-seats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}
.room-seat{min-height:72px;border:1px dashed #5879C2;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#172B60;font-size:11px;color:var(--white)}
.room-seat .seat-icon{font-size:24px}
.room-seat.occupied{border:1px solid #A98BFF}
.piu-feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.piu-feature{background:linear-gradient(145deg,#243B78,#302451);color:var(--white);border:1px solid #5879C2;border-radius:16px;padding:16px;text-align:center;cursor:pointer}
.piu-feature strong{display:block;margin:7px 0;color:#A98BFF}
.piu-gift-animation{position:fixed;z-index:100;left:50%;top:42%;transform:translate(-50%,-50%);font-size:75px;pointer-events:none;animation:piuGift 1.5s ease forwards}
@keyframes piuGift{0%{opacity:0;transform:translate(-50%,20%) scale(.3)}25%{opacity:1;transform:translate(-50%,-20%) scale(1.3)}75%{opacity:1;transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%) scale(.6)}}
.entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.entry-choice{padding:12px 4px;text-align:center;background:#243B78;border:1px solid #8156D9;border-radius:13px;cursor:pointer;color:var(--white)}
.entry-choice b{display:block;font-size:26px}

/* LOGO ET BADGE HD 4K */
.piu-home-logo{width:112px;height:112px;object-fit:contain;padding:8px;border-radius:50%;background:linear-gradient(145deg,#243B78,#50318F);border:2px solid #8156D9;box-shadow:0 0 25px #8156D9;margin:12px auto;display:block}
.piu-hd-badge{display:inline-block;font-size:10px;font-weight:bold;letter-spacing:2px;padding:5px 9px;margin:5px;border-radius:20px;color:var(--white);background:linear-gradient(100deg,#3478E8,#8156D9);border:1px solid #A98BFF;box-shadow:0 0 12px #8156D9}
.piu-home-title{font-size:27px;letter-spacing:1px;color:var(--white);text-shadow:0 0 15px #3478E8}
.piu-home-hero{background:linear-gradient(145deg,#101C46,#243B78,#50318F);border:1px solid #8156D9;border-radius:25px;padding:25px 15px;box-shadow:0 8px 25px #0005}
.piu-home-hero p{color:var(--white)}
.piu-home-tiles{margin-top:16px}

@media(max-width:520px){
 main{padding:7px}.card{padding:13px}
 .profile-stats{grid-template-columns:repeat(4,1fr)}
 .profile-stat strong{font-size:18px}.profile-stat span{font-size:9px}
 .profile-shortcuts{grid-template-columns:repeat(4,1fr)}
 .profile-showcase .avatar{width:85px;height:85px}
 .profile-showcase .profile-name{font-size:20px}
 .profile-follow-plus{width:54px;height:54px;min-width:54px;font-size:33px}
 .room-seats{gap:5px}.room-seat{min-height:65px}
 .piu-home-logo{width:95px;height:95px}
 .piu-home-title{font-size:23px}
}

/* FINITIONS PROFILS */
.profile-page{padding:0}
.profile-showcase{padding:14px}
.profile-cover{height:165px}
.profile-showcase .profile-top{margin-top:-52px}
.profile-showcase .avatar{width:105px;height:105px}
.profile-bottom-actions{align-items:center}
.profile-bottom-actions .message-action{
 flex:1;min-height:55px;border-radius:30px;
 background:linear-gradient(100deg,#50318F,#8156D9,#3478E8);
 border:1px solid #A98BFF;font-weight:bold;
}
.profile-bottom-actions .profile-follow-plus{
 flex:0 0 55px;width:55px;height:55px;min-width:55px;
 border-radius:50%;padding:0;font-size:32px;
}
.profile-tabs div{cursor:pointer;color:#A9BCEB}
.profile-tabs div.active{color:#BFD5FF;border-bottom:3px solid #A98BFF;background:#50318F55}
.profile-info-card{min-height:88px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.profile-private-card{min-height:105px}
.profile-public-section h3{border-bottom:1px solid #405B9B;padding-bottom:7px}
.profile-edit{scroll-margin-top:85px}
</style>
</head>
