
<style>
/* ==========================================
   PIU-PIU — THEME PREMIUM BLEU / VIOLET
   Design mobile HD • Effets lumineux
========================================== */

:root {
  --bg: #08132f;
  --panel: #142650;
  --panel2: #1c3670;
  --gold: #ffd36a;
  --white: #fff;
  --muted: #c1d2f5;
  --line: #4567b5;
  --green: #3478e8;
  --mint: #64c9ff;
  --emerald: #3478e8;
  --pink: #8156d9;
  --purple: #8156d9;
  --cyan: #70d9ff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background:
    radial-gradient(ellipse at top, #1c3470 0%, transparent 65%),
    linear-gradient(160deg, #08132f, #101d42);
  color: white;
  font-family: Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 1000px;
  margin: 14px auto;
  padding: 10px;
}

/* CARTES */

.card,
.room-card {
  background: linear-gradient(145deg, #192e5b, #101d40);
  border: 1px solid #4265b8;
  border-radius: 23px;
  box-shadow: 0 8px 30px #0005, inset 0 1px 0 #ffffff16;
}

h2, h3 {
  color: #a9dfff;
}

.muted, small {
  color: #c1d2f5;
}

a {
  color: #8bdcff;
}

/* HEADER */

.piu-header {
  background: linear-gradient(110deg, #09152f, #173b82, #542c91);
  border-bottom: 1px solid #55baff;
  box-shadow: 0 4px 25px #0008;
  backdrop-filter: blur(15px);
}

.piu-menu-button,
.piu-account {
  background: linear-gradient(145deg, #3478e8, #8156d9);
  border: 1px solid #91d9ff;
  box-shadow: 0 0 15px #3478e866;

}

.piu-brand .logo {

  height: 43px;

  border-radius: 50%;

  padding: 3px;
  border: 2px solid #8bdcff;
}

.piu-brand h1 {
  color: #b8eaff;
}

.piu-side-menu {
  background: linear-gradient(180deg, #101d42, #172d64, #281950);
  border-right: 1px solid #62bfff;
}

.piu-menu-head h2 {
  color: #a9dfff;
}

.piu-menu-group {
  color: #d2b7ff;
}

.piu-side-menu > button:not(.piu-menu-close) {
  border: 1px solid transparent;
  border-radius: 14px;
  margin: 5px 0;
  padding: 13px;
  color: white;
}

.piu-side-menu > button:not(.piu-menu-close):hover,
.piu-side-menu > button:not(.piu-menu-close):active {
  background: linear-gradient(100deg, #245fc5, #713bc0);

}

/* BOUTONS */

button {
  background: linear-gradient(120deg, #245fc5, #5838a8);
  border: 1px solid #75cfff;
  color: white;
  border-radius: 15px;
  font-weight: bold;
  box-shadow: 0 4px 12px #0003;
  transition: transform .2s, box-shadow .2s;
}

button:hover {
  box-shadow: 0 0 18px #3478e877;
}

button:active {
  transform: scale(.96);
}

button.gold,
button.pink {
  background: linear-gradient(110deg, #3478e8, #8156d9);
  color: white;
  border: 1px solid #a9dfff;
  box-shadow: 0 5px 18px #3478e855;
}

.bottom-nav {

  border-top: 1px solid #5c9ce9;
  box-shadow: 0 -5px 25px #0007;
  backdrop-filter: blur(15px);
}

.bottom-nav button {
  color: #c1d2f5;
  background: transparent;
  border: 0;
  box-shadow: none;
}

.bottom-nav button span {
  font-size: 24px;
  filter: drop-shadow(0 2px 5px #3478e8aa);
}

.bottom-nav button.active {
  color: #a9dfff;
  background: linear-gradient(120deg, #245fc566, #8156d966);
}

    linear-gradient(140deg, #142b60, #21164d);

  padding: 25px 16px;
  box-shadow: 0 10px 35px #0005, 0 0 20px #3478e833;
}

#home .logo {
  width: 125px;
  height: 125px;

  border-radius: 50%;

  box-shadow: 0 0 25px #3478e888;
}

.piu-feature {

  transition: transform .2s, box-shadow .2s;
}

.tile:active,
.piu-feature:active {

}

.tile p,
.piu-feature small {

}

.piu-feature strong {
  color: #a9dfff;
}

.tile .symbol {
  font-size: 42px;
  margin-bottom: 10px;
}

/* HERO */

.piu-hero {
  background:
    radial-gradient(circle at 20% 0%, #3478e8aa, transparent 55%),
    linear-gradient(130deg, #101d42, #263c82, #542c91);
  border: 1px solid #78cfff;
  border-radius: 25px;
  box-shadow: 0 8px 25px #0005, 0 0 20px #3478e833;
}

.piu-hero h2,
.piu-hero p {
  color: white;
}

/* PROFIL */

.profile-page {
  background: linear-gradient(155deg, #142b60, #101b3c);
  border: 1px solid #64c9ff;
}

.profile-top .avatar {
  border-color: #64c9ff;
  box-shadow: 0 0 20px #3478e899;
}

.profile-stats,
.profile-shortcuts,
.profile-center-links {
  background: linear-gradient(145deg, #eaf2ff, #e5dcff);
  color: #101d42;
}

.profile-stat strong {
  color: #172b60;
}

.profile-shortcut {
  color: #172b60;
}

.profile-private-card {
  background: linear-gradient(140deg, #d8ecff, #e6ddff);
  color: #172b60;
}

.profile-private-card.pink {
  background: linear-gradient(140deg, #e7ddff, #d7e8ff);
}

.profile-vip-bar {
  background: linear-gradient(110deg, #3478e8, #8156d9);
  color: white;
  box-shadow: 0 5px 18px #3478e855;
}

.profile-banner {
  background: linear-gradient(110deg, #101d42, #245fc5, #713bc0);
}

.room-seat {
  background: #152957;
  border-color: #67bfff;
}

.room-seat.occupied {
  border-color: #ffd36a;
}

/* FORMULAIRES */

input,
textarea,
select {
  background: #f5f8ff;
  color: #14234a;
  border: 1px solid #83baff;
  border-radius: 13px;
}

.badge {
  background: linear-gradient(110deg, #3478e8, #8156d9);
  color: white;
}

.notice,
.message {
  background: linear-gradient(145deg, #1c3978, #19234b);
  border-left: 4px solid #64c9ff;
  color: white;
}

.mine {
  border: 1px solid #8156d9;
}

/* PROGRESSION */

.progress {
  background: #243b70;
}

.progress > span {
  background: linear-gradient(90deg, #3478e8, #8156d9, #64c9ff);
  box-shadow: 0 0 12px #64c9ff88;
}

/* PRIX */

.price {
  color: #a9dfff;
}

/* ICÔNES : RELIEF ET LUMINOSITÉ */

.symbol,
.seat-icon,
.entry-choice b {
  filter:
    drop-shadow(0 3px 2px #0008)
    drop-shadow(0 0 8px #65caff88);
}

/* ANIMATION DOUCE */

.card,
.tile,
.piu-feature,
.room-card {
  transition: transform .2s, box-shadow .2s;
}

.tile:hover,
.piu-feature:hover {
  box-shadow: 0 10px 28px #3478e844;
}

/* MOBILE */

@media(max-width:520px) {
  body {
    padding-top: 78px;
  }

  main {
    padding: 8px;
  }

  #home .logo {
    width: 110px;
    height: 110px;
  }

  .tile .symbol {
    font-size: 38px;
  }

  .card,
  .tile,
  .piu-feature,
  .room-card {
    border-radius: 19px;
  }
}
