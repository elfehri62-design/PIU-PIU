<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b45ee">
<title>PIU-PIU</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f7f5ff; color: #222; }
header { background: #8b45ee; color: white; padding: 22px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 27px; font-weight: bold; }
header button { background: white; color: #8b45ee; border: 0; border-radius: 20px; padding: 10px 15px; }
h2 { padding: 0 16px; }
.stories { display: flex; gap: 15px; overflow-x: auto; padding: 12px 16px; }
.story { min-width: 65px; text-align: center; }
.circle { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(45deg,#ff65ae,#8b45ee); border: 3px solid white; margin: auto auto 6px; display: grid; place-items: center; font-size: 25px; }
.live { background: white; margin: 16px; border-radius: 16px; overflow: hidden; box-shadow: 0 3px 12px #ddd; }
.live-image { background: linear-gradient(135deg,#a54cf2,#fa72bb); height: 190px; display: grid; place-items: center; color: white; font-size: 35px; }
.live-info { padding: 14px; }
.tag { color: #e52d63; font-weight: bold; }
nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 14px 4px; box-shadow: 0 -2px 10px #ddd; }
nav button { border: 0; background: none; font-size: 13px; color: #555; }
nav button span { display: block; font-size: 23px; margin-bottom: 4px; }
main { padding-bottom: 85px; }
</style>
</head>
<body>
<header>
  <div class="logo">💜 PIU-PIU</div>
  <button onclick="alert('Bienvenue sur PIU-PIU !')">Se connecter</button>
</header>
<main>
  <h2>Découvrir les amis</h2>
  <div class="stories">
    <div class="story"><div class="circle">＋</div>Ajouter</div>
    <div class="story"><div class="circle">😍</div>Emma</div>
    <div class="story"><div class="circle">😎</div>Lucas</div>
    <div class="story"><div class="circle">🥰</div>Sarah</div>
    <div class="story"><div class="circle">🔥</div>Alex</div>
  </div>
  <h2>🔴 Lives en direct</h2>
  <div class="live">
    <div class="live-image">📹 LIVE</div>
    <div class="live-info">
      <span class="tag">● EN DIRECT</span>
      <h3>Bienvenue sur PIU-PIU</h3>
      <p>Découvre les lives de la communauté.</p>
      <button onclick="alert('Les lives seront bientôt disponibles !')">Regarder</button>
    </div>
  </div>
  <h2>📸 Publications</h2>
  <div class="live">
    <div class="live-image">📷</div>
    <div class="live-info">
      <h3>La communauté PIU-PIU</h3>
      <p>Partage tes meilleurs moments !</p>
      ❤️ J'aime
    </div>
  </div>
</main>
<nav>
  <button onclick="location.href='#'"><span>🏠</span>Accueil</button>
  <button onclick="alert('Lives bientôt disponibles')"><span>📹</span>Live</button>
  <button onclick="alert('Photos bientôt disponibles')"><span>📸</span>Photos</button>
  <button onclick="alert('Messages bientôt disponibles')"><span>💬</span>Messages</button>
  <button onclick="alert('Profil bientôt disponible')"><span>👤</span>Profil</button>
</nav>
</body>
</html>
